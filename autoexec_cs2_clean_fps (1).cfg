// CS2 AUTOEXEC: balanced FPS + clean HUD + radar + sound
// Built for a 240 Hz display. Start with fps_max 240; adjust if the laptop cannot hold it steadily.

// ===== FPS / FRAME LIMIT =====
fps_max "240"
fps_max_ui "120"

// ===== CLEAN SCREEN / REMOVE BUILD DATE =====
r_show_build_info "0"
developer "0"
cl_showfps "0"
cl_hud_telemetry_frametime_show "0"
cl_hud_telemetry_ping_show "0"
cl_hud_telemetry_net_misdelivery_show "0"
cl_hud_telemetry_net_detailed "0"
cl_hud_telemetry_serverrecvmargin_graph_show "0"
cl_autohelp "0"
gameinstructor_enable "0"
cl_show_clan_in_death_notice "0"
cl_allow_animated_avatars "0"
cl_teamcounter_playercount_instead_of_avatars "1"

// ===== HUD =====
hud_scaling "0.90"
cl_hud_color "10"
cl_showloadout "1"
hud_showtargetid "1"
cl_teamid_overhead_mode "1"
cl_teamid_overhead_colors_show "1"
cl_teammate_colors_show "1"

// ===== RADAR =====
cl_radar_always_centered "0"
cl_radar_rotate "1"
cl_radar_scale "0.40"
cl_radar_icon_scale_min "0.65"
cl_hud_radar_scale "1.15"
cl_radar_square_with_scoreboard "0"

// ===== LESS MENU / ROUND MUSIC =====
snd_menumusic_volume "0"
snd_menumap_volume "0"
snd_mapobjective_volume "0"
snd_mvp_volume "0"
snd_deathcamera_volume "0"
snd_mute_mvp_music_live_players "1"

// ===== VIEWMODEL (visual preference; not an FPS boost) =====
viewmodel_presetpos "1"
viewmodel_fov "68"
viewmodel_offset_x "2.5"
viewmodel_offset_y "0"
viewmodel_offset_z "-1.5"

// Save user config and print confirmation in console.
host_writeconfig
echo "CS2 clean FPS autoexec loaded"
